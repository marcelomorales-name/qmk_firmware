name: Publish marce keymap viz to Pages

on:
  push:
    branches: [feature/marce]
    paths:
      - "keyboards/lily58/keymaps/marce/keymap-viz.html"
      - "keyboards/crkbd/keymaps/marce/keymap-viz.html"
      - ".github/workflows/marce-keymap-viz.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble site
        run: |
          mkdir -p _site/lily58 _site/corne
          cp keyboards/lily58/keymaps/marce/keymap-viz.html _site/lily58/index.html
          cp keyboards/crkbd/keymaps/marce/keymap-viz.html _site/corne/index.html
          printf '%s\n' \
            '<!doctype html>' \
            '<meta charset="utf-8">' \
            '<title>marce keymaps</title>' \
            '<ul>' \
            '  <li><a href="lily58/">Lily58L marce keymap</a></li>' \
            '  <li><a href="corne/">Corne v4 marce keymap</a></li>' \
            '</ul>' \
            > _site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
